<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: rgb(33, 82, 110);
        color: black;
      }
      .container {
        display: flex;
        max-width: 800px;
        width: 100%;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
      .left-side {
        flex: 1;
        padding: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 20px; /* Tambahkan margin kanan di sini */
      }
      .right-side {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-left: 20px; /* Tambahkan margin kiri di sini */
      }
      .profile-image {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        transition: box-shadow 0.3s ease; /* Transisi efek glowing */
      }
      .profile-image-container {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
      }
      .profile-image-container::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0); /* Efek glowing saat tidak di-hover */
        transition: box-shadow 0.3s ease;
      }
      .profile-image-container:hover::after {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.7); /* Efek glowing saat hover */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left-side">
        <h1>Hiii saya adalah Okta Azhar R</h1>
      </div>
      <div class="right-side">
        <div class="profile-image-container">
          <img
            class="profile-image"
            src="foto-removebg.png"
            alt="Profile Image"
          />
        </div>
      </div>
    </div>
  </body>
</html>
